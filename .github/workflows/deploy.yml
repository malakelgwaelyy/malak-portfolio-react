name: Deploy Malak Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: malak-react-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: malak-react-portfolio
        run: npm ci

      - name: Build
        working-directory: malak-react-portfolio
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: malak-react-portfolio/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
